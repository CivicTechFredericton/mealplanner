<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Good Meal Plan" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Good Meal Plan - Meal Planner</title>

    <!-- Material UI requirements -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <script>
      const p = new URLSearchParams(window.location.search);
      const hasOauthParams = p.has("code") || p.has("state") || p.has("error");

      // Keep hash-based routing, but do not rewrite OAuth callback URLs
      if (!window.location.hash && !hasOauthParams) {
        const currentPath = window.location.pathname + window.location.search;
        window.location.replace(window.location.origin + "/#" + currentPath);
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
